# Checks on every push and pull request. Owner's guidebook practice: a broken
# branch is caught by a machine, not by luck. Each step prints its numbers, so
# the run log is the evidence for a change.
name: ci

on:
  push:
  pull_request:

# Public repository: the CI token can only read. No job needs to write, and no
# secret is used, so a pull request from a fork cannot change anything.
permissions:
  contents: read

jobs:
  editor-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/odia-browser-tools" --no-save --package-lock=false playwright@1.58.2
          "$RUNNER_TEMP/odia-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build production app
        run: npx vite build --config Appv2/vite.config.ts
      - name: Editor, dictionary and phone browser regressions
        run: |
          python3 -m http.server 4810 --bind 127.0.0.1 --directory Appv2/dist > "$RUNNER_TEMP/odia-browser-server.log" 2>&1 &
          odia_server_pid=$!
          trap 'kill "$odia_server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4810/ > /dev/null; then break; fi
            sleep 1
          done
          export NODE_PATH="$RUNNER_TEMP/odia-browser-tools/node_modules"
          node Appv2/eval/browser/editing-check.mjs 4810
          node Appv2/eval/browser/english-check.mjs 4810
          node Appv2/eval/browser/mobile-check.mjs 4810
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests (core, Appv2, fallback page)
        run: npm test

      - name: Appv2 rule files are up to date
        run: npx tsx Appv2/scripts/gen-rules.ts --check

      - name: Build the engine
        run: npm run build -w @odia/core

      - name: Held-out accuracy (delta vs tools/eval/baseline.json)
        run: npm run eval

      - name: Everyday accuracy
        run: npx tsx tools/eval/everyday.ts

      - name: Colloquial Odia (report only, unvalidated seed)
        run: npx tsx tools/eval/colloquial.ts

      - name: Words in context (report only)
        run: npx tsx tools/eval/context.ts

      - name: Appv2 suite (no-regression, Sanskrit coverage, sloka)
        run: npx tsx Appv2/eval/run.ts

      # Known open problem (AGENTS.md section 7.1): some letters are not reachable
      # in the top 9, so this exits non-zero today. Reported, not blocking.
      - name: Orthographic coverage (report only)
        run: npx tsx tools/eval/coverage.ts
        continue-on-error: true

      - name: Build the web apps
        run: |
          npm run build -w @odia/web
          npx vite build --config Appv2/vite.config.ts
